<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuatro de Mayo</title>

<!--
  ============================================================
  CUATRO DE MAYO - Página de inicio (esqueleto del sitio)
  ============================================================
  Esta es la página principal. Muestra los tres rubros
  (Empresa, Agricultura, Ganadería) lado a lado, cada uno
  con sus secciones a la vista. Un clic en una sección
  entra directo a ella.

  CÓMO AGREGAR O ACTIVAR UNA SECCIÓN EN EL FUTURO:
  Buscá más abajo la sección "MAPA DEL SITIO" (está marcada
  bien claro). Es una lista. Para activar una sección nueva,
  se cambia su "estado" a "listo" y se le pone el archivo.

  CÓMO CAMBIAR USUARIO Y CONTRASEÑA:
  Buscá la sección "CONFIGURACIÓN DE ACCESO".
  ============================================================
-->

<style>
  :root {
    --verde-osc:   #2E5D0C;   /* verde profundo: cabecera, paneles */
    --verde-med:   #8FD13F;   /* verde brillante: titulos y detalles sobre negro */
    --verde-claro: #B6E87A;   /* verde claro: acentos */
    --verde-borde: #3E7416;   /* bordes verdosos */
    --gris-texto:  #ECECE9;   /* texto principal claro */
    --gris-suave:  #A8A8A2;   /* texto secundario */
    --gris-linea:  #3A3A38;   /* lineas y bordes tenues */
    --gris-fondo:  #121211;   /* fondo negro suave de la pagina */
    --panel:       #1E1E1C;   /* fondo de paneles/tarjetas */
    --panel-claro: #292927;   /* fondo de elementos algo mas claros */
    --blanco:      #1E1E1C;   /* (sustituto: ya no se usa blanco puro) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--gris-fondo);
    color: var(--gris-texto);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ----- Pantalla de acceso ----- */
  #login {
    position: fixed; inset: 0;
    background: var(--gris-fondo);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  #login .caja {
    background: var(--panel); border-radius: 14px;
    border: 1px solid var(--gris-linea);
    padding: 38px 32px; width: 100%; max-width: 380px; text-align: center;
  }
  #login h1 { color: var(--verde-med); font-size: 26px; margin-bottom: 4px; }
  #login p.sub { color: var(--gris-suave); font-size: 16px; margin-bottom: 24px; }
  #login label {
    display: block; text-align: left; font-size: 16px;
    color: var(--verde-med); font-weight: 600; margin: 14px 0 5px;
  }
  #login input {
    width: 100%; padding: 13px 14px;
    border: 1px solid var(--gris-linea); border-radius: 8px;
    font-size: 17px; background: var(--panel-claro); color: var(--gris-texto);
  }
  #login input:focus { outline: 2px solid var(--verde-med); border-color: var(--verde-med); }
  #login button {
    width: 100%; margin-top: 22px; padding: 14px;
    background: var(--verde-med); color: #11250A;
    border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  #login button:hover { background: var(--verde-claro); }
  #login .error { color: #F0999B; font-size: 15px; margin-top: 12px; min-height: 18px; }

  /* ----- Aplicación ----- */
  #app { display: none; }

  /* Encabezado con nombre de la empresa (NIVEL 1 - texto mas grande) */
  .cabecera {
    background: var(--verde-osc); color: #FFFFFF;
    padding: 22px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cabecera .marca { font-size: 30px; font-weight: 700; letter-spacing: 0.3px; }
  .cabecera .btn-salir {
    background: none; border: 1px solid rgba(255,255,255,.5);
    color: #FFFFFF; font-size: 16px; padding: 9px 18px;
    border-radius: 8px; cursor: pointer;
  }
  .cabecera .btn-salir:hover { background: rgba(255,255,255,.15); }

  .contenido {
    max-width: 1100px; margin: 0 auto; padding: 28px 20px;
  }
  .intro {
    font-size: 16px; color: var(--gris-suave); margin-bottom: 22px;
  }

  /* Las tres columnas de rubros, lado a lado */
  .rubros {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    align-items: start;
  }

  /* Cada rubro */
  .rubro {
    background: var(--panel);
    border: 1px solid var(--gris-linea);
    border-radius: 12px;
    overflow: hidden;
  }
  /* Titulo del rubro (NIVEL 2 - texto mediano) */
  .rubro .titulo {
    background: var(--verde-osc);
    border-bottom: 1px solid var(--verde-borde);
    padding: 16px;
    text-align: center;
  }
  .rubro .titulo .nombre-rubro {
    font-size: 22px; font-weight: 700; color: #FFFFFF;
  }
  .rubro .titulo .cuenta {
    font-size: 14px; color: var(--verde-claro); margin-top: 3px;
  }
  .rubro .cuerpo {
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 120px;
  }

  /* Cada seccion (NIVEL 3 - texto mas chico) */
  .seccion {
    border: 1px solid var(--gris-linea);
    border-radius: 8px;
    padding: 14px 15px;
  }
  .seccion.disponible {
    cursor: pointer;
    background: var(--panel-claro);
    transition: background .12s, border-color .12s;
  }
  .seccion.disponible:hover {
    background: var(--verde-osc);
    border-color: var(--verde-med);
  }
  .seccion.proxima {
    background: var(--gris-fondo);
    opacity: 0.8;
  }
  .seccion .nombre-seccion {
    font-size: 17px; font-weight: 600; color: var(--verde-med);
  }
  .seccion.proxima .nombre-seccion { color: var(--gris-suave); }
  .seccion .estado { font-size: 14px; margin-top: 3px; }
  .seccion .estado.listo { color: var(--verde-claro); font-weight: 600; }
  .seccion .estado.proximo { color: var(--gris-suave); }

  .rubro-vacio {
    font-size: 16px; color: var(--gris-suave);
    text-align: center; padding: 24px 10px;
  }

  .pie {
    text-align: center; font-size: 14px; color: var(--gris-suave);
    padding: 24px; margin-top: 10px;
  }

  /* ----- En celular: las columnas se apilan y el texto crece ----- */
  @media (max-width: 760px) {
    .rubros { grid-template-columns: 1fr; }
    .cabecera { padding: 20px; }
    .cabecera .marca { font-size: 26px; }
    .rubro .titulo .nombre-rubro { font-size: 24px; }
    .seccion { padding: 16px; }
    .seccion .nombre-seccion { font-size: 19px; }
    .seccion .estado { font-size: 15px; }
    .intro { font-size: 17px; }
  }
</style>
</head>
<body>

<!-- ===================== PANTALLA DE ACCESO ===================== -->
<div id="login">
  <div class="caja">
    <h1>Cuatro de Mayo</h1>
    <p class="sub">Ingresá para ver la información</p>
    <label for="in-user">Usuario</label>
    <input type="text" id="in-user" autocomplete="off">
    <label for="in-pass">Contraseña</label>
    <input type="password" id="in-pass">
    <button id="btn-entrar">Entrar</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- ===================== APLICACIÓN ===================== -->
<div id="app">
  <div class="cabecera">
    <span class="marca">Cuatro de Mayo</span>
    <button class="btn-salir" id="btn-salir">Salir</button>
  </div>

  <div class="contenido">
    <p class="intro">Elegí una sección para ver la información. Un solo clic.</p>
    <div class="rubros" id="lista-rubros"><!-- generado por JS --></div>
  </div>

  <div class="pie">Cuatro de Mayo · información de gestión agropecuaria</div>
</div>

<script>
/* ================================================================
   CONFIGURACIÓN DE ACCESO  (usuario y contraseña)
   ----------------------------------------------------------------
   Barrera liviana, no seguridad real. Cambiá los dos textos.
   ================================================================ */
var USUARIO_OK    = "equipo";
var CONTRASENA_OK = "cuatrodemayo2025";


/* ================================================================
   MAPA DEL SITIO
   ----------------------------------------------------------------
   Estructura del sitio. Para CADA sección:
     - nombre:  el texto que se ve en la tarjeta
     - estado:  "listo"  -> la sección se puede abrir
                "proximo" -> muestra "Próximamente", no se abre
     - archivo: nombre del archivo HTML de esa sección
                (solo importa si el estado es "listo")

   PARA ACTIVAR UNA SECCIÓN NUEVA EN EL FUTURO:
     1. Creá su archivo (ej: "costos.html").
     2. Acá abajo, cambiá su "estado" de "proximo" a "listo".
     3. Verificá que "archivo" tenga el nombre correcto.

   PARA AGREGAR UN RUBRO NUEVO:
     Copiá un bloque { rubro: ..., secciones: [...] } completo
     y pegalo en la lista, con sus secciones.
   ================================================================ */
var MAPA = [
  {
    rubro: "Empresa",
    secciones: [
      { nombre: "Gestión Económica", estado: "proximo", archivo: "" }
    ]
  },
  {
    rubro: "Agricultura",
    secciones: [
      { nombre: "Rindes",         estado: "listo",   archivo: "rindes.html" },
      { nombre: "Stock Insumos",  estado: "proximo", archivo: "stock.html" },
      { nombre: "Costos",         estado: "proximo", archivo: "costos.html" }
    ]
  },
  {
    rubro: "Ganadería",
    secciones: [
      { nombre: "Próximamente", estado: "proximo", archivo: "" }
    ]
  }
];


/* ================================================================
   DE ACÁ PARA ABAJO NO HACE FALTA TOCAR NADA
   ================================================================ */

/* ---------- Pantalla de acceso ---------- */
function intentarEntrar() {
  var u = document.getElementById("in-user").value.trim();
  var p = document.getElementById("in-pass").value;
  if (u === USUARIO_OK && p === CONTRASENA_OK) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    armarRubros();
  } else {
    document.getElementById("login-error").textContent =
      "Usuario o contraseña incorrectos.";
  }
}
document.getElementById("btn-entrar").addEventListener("click", intentarEntrar);
document.getElementById("in-pass").addEventListener("keydown", function(e){
  if (e.key === "Enter") intentarEntrar();
});
document.getElementById("btn-salir").addEventListener("click", function(){
  location.reload();
});


/* ---------- Dibujar los tres rubros con sus secciones ---------- */
function armarRubros() {
  var cont = document.getElementById("lista-rubros");
  cont.innerHTML = "";

  MAPA.forEach(function(r){
    var div = document.createElement("div");
    div.className = "rubro";

    /* contar secciones reales (las que no son el cartel "Próximamente") */
    var reales = r.secciones.filter(function(s){
      return s.nombre.toLowerCase() !== "próximamente";
    });
    var textoCuenta = reales.length === 0 ? "Sin secciones aún"
                    : reales.length === 1 ? "1 sección"
                    : reales.length + " secciones";

    /* título del rubro */
    var titulo = '<div class="titulo">' +
      '<div class="nombre-rubro">' + r.rubro + '</div>' +
      '<div class="cuenta">' + textoCuenta + '</div>' +
      '</div>';

    /* cuerpo con las secciones */
    var cuerpo = '<div class="cuerpo">';
    r.secciones.forEach(function(s){
      var esCartel = s.nombre.toLowerCase() === "próximamente";
      if (esCartel) {
        cuerpo += '<div class="rubro-vacio">Próximamente</div>';
        return;
      }
      var disponible = (s.estado === "listo");
      var clase = disponible ? "seccion disponible" : "seccion proxima";
      var estado = disponible
        ? '<div class="estado listo">Disponible</div>'
        : '<div class="estado proximo">Próximamente</div>';
      cuerpo += '<div class="' + clase + '" data-archivo="' +
                (disponible ? s.archivo : "") + '">' +
                '<div class="nombre-seccion">' + s.nombre + '</div>' +
                estado + '</div>';
    });
    cuerpo += '</div>';

    div.innerHTML = titulo + cuerpo;
    cont.appendChild(div);
  });

  /* clic en una sección disponible -> abre su archivo */
  var disponibles = document.querySelectorAll(".seccion.disponible");
  disponibles.forEach(function(el){
    el.addEventListener("click", function(){
      var arch = el.getAttribute("data-archivo");
      if (arch) window.location.href = arch;
    });
  });
}
</script>

</body>
</html>
